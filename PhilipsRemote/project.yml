name: PhilipsRemote
options:
  bundleIdPrefix: dk.h4xtor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PhilipsRemote:
    type: application
    platform: iOS
    sources:
      - path: PhilipsRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.h4xtor.philipsremote
        PRODUCT_NAME: Philips Remote
        INFOPLIST_FILE: PhilipsRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
